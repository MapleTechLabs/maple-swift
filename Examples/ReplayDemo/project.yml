name: ReplayDemo
options:
  bundleIdPrefix: dev.maple
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Maple:
    path: ../..

targets:
  ReplayDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Maple
        product: Maple
    # A real Info.plist rather than GENERATE_INFOPLIST_FILE, because the SDK's settings
    # have to live in it. `INFOPLIST_KEY_<name>` only works for the keys Xcode knows
    # about — arbitrary ones are dropped from the generated plist without a warning.
    #
    # Xcode expands `$(…)` in plist values at build time, so these are ordinary build
    # settings and a pipeline sets them like any other:
    #
    #   xcodebuild … MAPLE_INGEST_KEY=maple_pk_… MAPLE_ENVIRONMENT=production
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Landscape is listed so the e2e rotation scenario can use it; `DemoAppDelegate`
        # narrows every other launch back to portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The UI tests point the SDK at a plain-HTTP mock ingest on 127.0.0.1.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        Maple:
          IngestKey: $(MAPLE_INGEST_KEY)
          Endpoint: $(MAPLE_ENDPOINT)
          Environment: $(MAPLE_ENVIRONMENT)
          ServiceName: $(MAPLE_SERVICE_NAME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maple.ReplayDemo
        # Defaults for a local build; CI overrides them on the xcodebuild line.
        MAPLE_ENVIRONMENT: development
        MAPLE_SERVICE_NAME: replay-demo
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  # End-to-end suite: drives the app on a simulator against a mock ingest server that
  # runs inside the test runner. `scripts/e2e.sh` is the entry point.
  ReplayDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ReplayDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maple.ReplayDemoUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  ReplayDemo:
    build:
      targets:
        ReplayDemo: all
        ReplayDemoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReplayDemoUITests
